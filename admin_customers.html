{% extends 'base.html' %}{% block content %}<div class="page-title"><h1>Customers</h1><a class="btn" href="{{url_for('export_customers')}}">Export CSV</a></div><div class="panel">{% for u in customers %}<div class="order-row"><span><b>{{u.email}}</b><small>{{u.customer_type}} · {{u.created_at.date()}}</small></span><span>{{u.status}}</span><form method="post" action="{{url_for('customer_status',uid=u.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><select name="status"><option value="active">Unblock / active</option><option value="blocked">Block</option><option value="inactive">Deactivate</option></select><button class="btn small">Save</button></form></div>{% endfor %}</div>{% endblock %}
