{% extends 'base.html' %}{% block content %}<div class="page-title"><h1>Coupon management</h1></div><div class="panel"><form class="form-grid" method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><input name="code" placeholder="Coupon code" required><select name="customer_type"><option value="retail">Retail</option><option value="wholesale">Wholesale</option></select><input name="percent" type="number" placeholder="Discount %" required><input name="minimum" type="number" placeholder="Minimum order ₹" required><input name="max_discount" type="number" placeholder="Maximum discount ₹" required><input name="expiry" type="date" required><button class="btn">Create coupon</button></form></div><div class="panel">{% for c in coupons %}<div class="order-row"><span><b>{{c.code}}</b><small>{{c.customer_type}} · {{c.percent}}% · expires {{c.expiry}}</small></span><span>{{'Active' if c.active else 'Inactive'}}</span>{% if c.active %}<form method="post" action="{{url_for('coupon_deactivate',cid=c.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="btn small">Deactivate</button></form>{% endif %}</div>{% endfor %}</div>{% endblock %}
