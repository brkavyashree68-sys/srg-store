{% extends 'base.html' %}{% block content %}<div class="page-title"><div class="eyebrow">Your purchases</div><h1>Order history</h1></div><div class="panel">{% for o in orders %}<a class="order-row" href="{{url_for('order_detail',number=o.number)}}"><span><b>{{o.number}}</b><small>{{o.created_at.strftime('%d %b %Y, %I:%M %p')}}</small></span><span class="badge">{{o.status}}</span><b>₹{{o.total}}</b></a>{% else %}<p>No orders yet.</p>{% endfor %}</div>{% endblock %}
