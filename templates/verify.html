{% extends 'base.html' %}{% block content %}<div class="auth"><div class="eyebrow">Email verification</div><h1>Enter your OTP.</h1><p>Verification code sent to {{destination}}. It is valid for 3 minutes.</p>{% if dev_otp %}<div class="flash success">Development OTP: <b>{{dev_otp}}</b> (console fallback only; not shown in production)</div>{% endif %}<form method="post" action="{{url_for('verify')}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>6-digit OTP</label><input name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required><button class="btn full">Verify & continue →</button></form></div>{% endblock %}
