{% extends 'base.html' %}{% block content %}<div class="page-title"><h1>Orders</h1></div><div class="panel">{% for o in orders %}<div class="admin-order"><div><b>{{o.number}}</b><small>{{o.user.email}} · ₹{{o.total}} · {{o.status}}</small></div><form method="post" action="{{url_for('admin_status',oid=o.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><select name="status">{% for s in ['Confirmed','Packed','Shipped','Delivered','Cancelled'] %}<option>{{s}}</option>{% endfor %}</select><button class="btn small">Update</button></form></div>{% endfor %}</div>{% endblock %}
